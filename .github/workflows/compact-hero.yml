name: Build compact profile hero

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_compact_header.py'
      - '.github/workflows/compact-hero.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python scripts/build_compact_header.py
      - name: Validate animated hero
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path('assets/github-reference-compact.gif')
          with Image.open(p) as im:
              assert im.size==(1200,292), im.size
              assert im.n_frames>=15, im.n_frames
          print('Validated',p.stat().st_size)
          PY
      - name: Publish hero
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-reference-compact.gif
          if ! git diff --cached --quiet; then
            git commit -m 'assets: add compact dark developer hero'
            git push origin HEAD:main
          fi
