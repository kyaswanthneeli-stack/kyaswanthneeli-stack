name: Render floating AI GitHub profile

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_floating_portfolio.py'
      - '.github/workflows/floating-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install graphics renderer
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate unique animated holograms and project cards
        run: python scripts/build_floating_portfolio.py
      - name: Verify real GIF animation and PNG
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files = [
              "floating-ai-hero.gif", "codeatlas-floating.gif",
              "agentgate-floating.gif", "routewise-floating.gif",
              "verified-metrics.png",
          ]
          for name in files:
              path = Path("assets") / name
              assert path.exists(), (name, "missing")
              size = path.stat().st_size
              assert 5000 < size < 12_000_000, (name, size)
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  if path.suffix == ".gif":
                      assert im.n_frames >= 12, (name, im.n_frames)
                      print(name, im.size, "frames", im.n_frames, "bytes", size)
                  else:
                      print(name, im.size, "bytes", size)
          PY
      - name: Publish verified assets to profile repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/floating-ai-hero.gif assets/codeatlas-floating.gif assets/agentgate-floating.gif assets/routewise-floating.gif assets/verified-metrics.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets: publish animated holographic GitHub profile'
            git push origin HEAD:main
          else
            echo 'Animated assets already current'
          fi
