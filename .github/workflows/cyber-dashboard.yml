name: Render cyber dashboard artwork

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_cyber_dashboard.py'
      - '.github/workflows/cyber-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate original cyber dashboard graphics
        run: python scripts/build_cyber_dashboard.py
      - name: Validate generated images and animation
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          files = ["cyber-command-center.gif","cyber-system-dashboard.png",
                   "cyber-tech-matrix.png","codeatlas-cyber.png",
                   "agentgate-cyber.png","routewise-cyber.png"]
          for name in files:
              path=Path("assets")/name
              assert path.exists(),name
              with Image.open(path) as image:
                  image.verify()
              with Image.open(path) as image:
                  if name.endswith(".gif"):
                      assert image.n_frames==24, (name,image.n_frames)
                  assert path.stat().st_size > 10000,(name,path.stat().st_size)
                  print(name,image.size,path.stat().st_size)
          PY
      - name: Commit render artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cyber-command-center.gif assets/cyber-system-dashboard.png assets/cyber-tech-matrix.png assets/codeatlas-cyber.png assets/agentgate-cyber.png assets/routewise-cyber.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish cyber command center dashboard art"
            git push origin HEAD:main
          else
            echo "Art already current"
          fi
