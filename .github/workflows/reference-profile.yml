name: Render GitHub profile reference design

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_reference_readme.py'
      - '.github/workflows/reference-profile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Build reference-inspired images
        run: python scripts/build_reference_readme.py
      - name: Validate generated image assets
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ["profile-reference-animated.gif","profile-reference-stats.png","profile-reference-skills.png"]:
              p=Path("assets")/name
              assert p.exists() and p.stat().st_size>5000,(name,p.stat().st_size if p.exists() else 0)
              with Image.open(p) as im:
                  im.verify()
              with Image.open(p) as im:
                  assert im.width==1200
                  if p.suffix==".gif": assert im.n_frames>=18,im.n_frames
                  print(name,im.size,p.stat().st_size)
          PY
      - name: Publish visuals into GitHub profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-reference-animated.gif assets/profile-reference-stats.png assets/profile-reference-skills.png
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish reference-inspired GitHub profile visuals"
            git push origin HEAD:main
          else
            echo "Graphics unchanged"
          fi
