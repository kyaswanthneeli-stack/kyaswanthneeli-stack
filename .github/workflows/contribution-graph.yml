name: Real GitHub contribution graph

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_real_contributions.py'
      - '.github/workflows/contribution-graph.yml'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch real contribution counts from GitHub
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_real_contributions.py
      - name: Validate SVG and prevent fabricated content
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          svg=Path("assets/github-contributions.svg")
          root=ElementTree.parse(svg).getroot()
          assert root.tag.endswith("svg") and svg.stat().st_size>2000
          assert "GitHub contribution calendar" in svg.read_text()
          print("SVG validated:",svg.stat().st_size)
          PY
      - name: Publish current contribution panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-contributions.svg
          if ! git diff --cached --quiet; then
            git commit -m "stats: update authentic GitHub contribution graph"
            git push origin HEAD:main
          fi
