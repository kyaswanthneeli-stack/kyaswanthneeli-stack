name: Render balanced floating portfolio v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_floating_v2.py'
      - '.github/workflows/floating-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install 'Pillow>=10,<13'
      - name: Generate color-coordinated GIFs and project graphics
        run: python scripts/build_floating_v2.py
      - name: Check animations, image sizes and file outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          expected = {
              'floating-hero-v2.gif': (1280,410),
              'codeatlas-v2.gif': (520,282),
              'agentgate-v2.gif': (520,282),
              'routewise-v2.gif': (520,282),
              'verified-metrics-v2.png': (1280,228),
              'system-strip-v2.png': (1280,128)
          }
          for name,expected_size in expected.items():
              path=Path('assets')/name
              assert path.is_file(),name
              size=path.stat().st_size
              assert 4000<size<12_000_000,(name,size)
              with Image.open(path) as im:
                  im.verify()
              with Image.open(path) as im:
                  assert im.size==expected_size,(name,im.size)
                  if name.endswith('.gif'):
                      assert im.n_frames >= 15,(name,im.n_frames)
                      print(name, im.n_frames, 'frames',size,'bytes')
                  else:
                      print(name, 'verified',size,'bytes')
          PY
      - name: Commit new graphics to GitHub profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/floating-hero-v2.gif assets/codeatlas-v2.gif assets/agentgate-v2.gif assets/routewise-v2.gif assets/verified-metrics-v2.png assets/system-strip-v2.png
          if ! git diff --cached --quiet; then
            git commit -m 'assets: publish balanced floating AI portfolio v2'
            git push origin HEAD:main
          else
            echo 'All visuals already current'
          fi
